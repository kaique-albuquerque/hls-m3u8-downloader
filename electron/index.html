<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Video Downloader</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div>
          <div class="eyebrow">HLS Downloader</div>
          <h1>Video Downloader</h1>
        </div>
        <div class="actions">
          <button id="newTabBtn" class="ghost">+ Nova aba</button>
        </div>
      </header>

      <nav id="tabBar" class="tabbar"></nav>

      <main id="tabPanels" class="panels"></main>
    </div>

    <template id="tabTemplate">
      <section class="panel">
        <div class="card">
          <label>
            URL do .m3u8
            <input data-field="url" placeholder="Cole a URL aqui" />
          </label>
          <div class="grid2">
            <label>
              Nome do arquivo
              <input data-field="filename" placeholder="aula-01" />
            </label>
            <label>
              Pasta de saída
              <div class="row">
                <input data-field="outputDir" placeholder="Downloads" />
                <button data-action="pickDir" class="ghost">Escolher</button>
              </div>
            </label>
          </div>
          <div class="row gap">
            <button data-action="analyze" class="primary">Analisar qualidade</button>
            <button data-action="download" class="accent">Baixar</button>
            <button data-action="cancel" class="ghost">Cancelar</button>
          </div>
        </div>

        <div class="card">
          <div class="section-title">Qualidades disponíveis</div>
          <div data-field="qualities" class="qualities empty">Nenhuma URL analisada ainda.</div>
        </div>

        <div class="card">
          <div class="section-title">Progresso</div>
          <div class="progress-shell">
            <div data-field="progressBar" class="progress-bar"></div>
          </div>
          <div data-field="status" class="status">Pronto.</div>
          <pre data-field="log" class="log"></pre>
        </div>
      </section>
    </template>

    <script type="module" src="./renderer.js"></script>
  </body>
</html>
